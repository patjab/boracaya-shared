name: CI

# boracaya-shared is PUBLIC, so this gate stays on GitHub-hosted runners: the
# minutes are free on a public repo, and a self-hosted runner here would run
# fork code on the desktop. It therefore does not call boracaya-ops's
# reusable `pr-gate` (private, Windows-shaped) - it only applies the same
# policy (cdk#1464): drafts skip the gate, `ready_for_review` fires it once,
# and the Node pin is read from .node-version (a copy of versions.yml's
# `node` in boracaya-ops; a public workflow cannot read the private file).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel superseded PR runs: a rapid re-push shouldn't run stale CI to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      # Consumers (valet, shore) install this repo as a git dependency and use the
      # committed dist/ verbatim (no prepare script rebuilds it on install), so a
      # build that drifts from the committed output would ship stale code undetected.
      - run: |
          if ! git diff --quiet -- dist docs/tree-shaking.md \
            || [ -n "$(git ls-files --others --exclude-standard -- dist docs/tree-shaking.md)" ]; then
            echo "generated output is stale — run npm run build and commit dist/ plus docs/tree-shaking.md"
            exit 1
          fi
      # `npm test` runs the full hermetic suite. src/api.smoke.test.ts stays OUT of
      # it on purpose: it is a live-network probe of the real APIs, so folding it in
      # would make every commit's gate depend on prod being reachable. Run it on
      # demand with `npm run test:smoke` (it is green again as of cdk#1364, which
      # removed the two constants pointing at the retired moments.pdaboracay.com).
      - run: npm test
