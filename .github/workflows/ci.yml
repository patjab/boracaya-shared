name: CI

on:
  pull_request:
    branches: [main]

# Cancel superseded PR runs: a rapid re-push shouldn't run stale CI to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      # The committed dist/ IS the consumed artifact (git dependency) — fail the
      # build if a source change wasn't accompanied by a rebuilt dist (#1287).
      - run: git diff --exit-code -- dist
      - run: npm test
