# Codex review configuration for boracaya-shared (cdk#1475). Read by the
# `codex-review` workflow in boracaya-ops on every round; flat YAML subset
# (inline or block lists, scalars, comments) - no YAML library on the runner.
# Unknown keys or axes fail the round on purpose.

# Automatic rounds, one per push, in this order; `final` again after every
# later push. Three axes; `/codex coupling` by hand when a PR changes an
# exported shape - the consumers (valet, shore) are the far side.
axes: [broad, tests, final]

# Files handed to the reviewer in full at the PR head, beyond the diff (the far
# side of a seam). Globs; keep this short - the payload has a 66KB budget and
# context goes first when it is over.
context: []

# Named in the prompt as out of scope for fixes; a finding that needs a change
# there is reported with stays_in_scope=false and a follow-up issue.
off_limits: "the consumers (boracaya-valet, boracaya-shore, boracaya-cdk) - they repin this package in their own PRs; the committed dist/ is generated by the build, never edited"

# A PR touching only these gets no automatic round (`/codex` still works).
skip_paths: ["**/*.md", "docs/**", "LICENSE"]

# Automatic rounds per PR before the workflow stops and asks for `/codex <axis>`.
round_cap: 8
